services:
  - type: web
    name: tankroyale-signal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node --experimental-strip-types server-render.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TR_ALLOWED_ORIGINS
        value: ""
      # Cloudflare Realtime TURN relay (dashboard: Realtime > TURN Server).
      - key: COT_CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: COT_CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: TR_ICE_SERVERS_JSON
        value: '[{"urls":"stun:stun.l.google.com:19302"},{"urls":"stun:stun1.l.google.com:19302"}]'
    healthCheckPath: /health
