name: Android Emulator Smoke

# Real Android (emulator, API 30) runs the CI debug APK of the same commit:
# boot -> garage -> Bots battle for ~75 s, screenshots + JS errors as artifacts.
on:
  workflow_run:
    workflows: [Android Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Android Build run id (blank = latest successful)
        required: false

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Testing Android Build run $RUN_ID"
          gh run download "$RUN_ID" -n tank-royale-debug -D apk
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Boot emulator, install, play a battle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emulator-smoke.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: emulator-results
          retention-days: 14
