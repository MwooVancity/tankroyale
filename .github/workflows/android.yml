name: Android Build

on:
  push:
    branches: [tank-royale-main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          VITE_SIGNAL_URL: ${{ secrets.VITE_SIGNAL_URL }}
          VITE_ICE_CONFIG_URL: ${{ secrets.VITE_ICE_CONFIG_URL }}
        run: npx cross-env VITE_PUBLIC_BUILD=1 npx vite build

      - name: Upload OTA bundle to Capgo
        if: ${{ env.CAPGO_TOKEN != '' }}
        continue-on-error: true
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: npx @capgo/cli@latest bundle upload --apikey "$CAPGO_TOKEN" --channel production

      - name: Inject google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GSJ != '' }}
        run: echo "$GSJ" > android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: android
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file=$(pwd)/app/debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            ./gradlew assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tank-royale-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release build (only when KEYSTORE_BASE64 secret is set)
      - name: Build release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/tank-royale.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/tank-royale.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tank-royale-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
