<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#05080b"/>

  <!-- Tank tracks (ground level) -->
  <rect x="60" y="320" width="392" height="64" rx="32" fill="#1a2535"/>
  <rect x="72" y="328" width="368" height="48" rx="24" fill="#0e1820"/>
  <!-- Track links -->
  <rect x="80" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="116" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="152" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="188" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="224" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="260" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="296" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="332" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="368" y="332" width="28" height="40" rx="6" fill="#1e3050"/>
  <rect x="404" y="332" width="28" height="40" rx="6" fill="#1e3050"/>

  <!-- Hull -->
  <rect x="80" y="248" width="352" height="88" rx="12" fill="#2a4060"/>
  <!-- Hull highlight -->
  <rect x="88" y="256" width="336" height="12" rx="4" fill="#3a5580" opacity="0.6"/>

  <!-- Turret -->
  <ellipse cx="220" cy="240" rx="110" ry="64" fill="#1e3355"/>
  <ellipse cx="220" cy="232" rx="104" ry="56" fill="#2a4575"/>
  <!-- Turret top highlight -->
  <ellipse cx="210" cy="222" rx="70" ry="28" fill="#3a5590" opacity="0.4"/>

  <!-- Gun barrel -->
  <rect x="300" y="225" width="148" height="22" rx="11" fill="#1a2d4a"/>
  <rect x="304" y="229" width="140" height="14" rx="7" fill="#243d62"/>
  <!-- Muzzle brake -->
  <rect x="432" y="218" width="24" height="36" rx="8" fill="#1a2d4a"/>

  <!-- Commander hatch -->
  <ellipse cx="180" cy="218" rx="28" ry="18" fill="#152540"/>
  <ellipse cx="180" cy="215" rx="22" ry="13" fill="#1e3355"/>

  <!-- Muzzle flash (accent) -->
  <polygon points="456,236 480,220 496,236 480,252" fill="#ff8c00" opacity="0.9"/>
  <polygon points="460,236 492,228 500,236 492,244" fill="#ffcc44" opacity="0.7"/>

  <!-- "TR" wordmark -->
  <text x="256" y="468" font-family="system-ui,sans-serif" font-weight="900" font-size="52"
        fill="#4a90d9" text-anchor="middle" letter-spacing="8">TANK ROYALE</text>
</svg>
